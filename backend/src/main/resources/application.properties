server.port=8080

# File-based H2 Database configuration
spring.datasource.url=jdbc:h2:file:./data/database/meshnotedb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

# Optional H2 Console (available at /h2-console if needed for viva)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart File Upload limits (500MB max per prompt specs)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# MESHNOTE Peer-to-Peer Networking Configuration
mesh.discovery.port=47777
mesh.p2p.port=49000
mesh.shared-directory=./data/shared
mesh.download-directory=./data/downloads
mesh.discovery.interval=5000
mesh.peer.timeout=15000
mesh.max-file-size=524288000
mesh.debug=false

# Logging Configuration
logging.level.com.meshnote=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=WARN
