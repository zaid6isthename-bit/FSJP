spring.application.name=jvm-vision
server.port=${PORT:8080}

# Database Configuration (PostgreSQL in production, H2 with PostgreSQL compatibility in local dev)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/jvmvision;AUTO_SERVER=TRUE;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Engine Execution Safety Constraints
jvmvision.engine.max-source-size=51200
jvmvision.engine.max-events=10000
jvmvision.engine.max-loop-iterations=5000
jvmvision.engine.max-recursion-depth=100
jvmvision.engine.max-output-size=102400

# CORS Configuration
jvmvision.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# Logging
logging.level.com.jvmvision=INFO
logging.level.org.springframework.jdbc=WARN
